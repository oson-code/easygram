easygram:
  # Required: your Telegram Bot API token from @BotFather
  token: "BOT_TOKEN"

  transport: KAFKA_CONSUMER

  kafka-consumer:
    # Kafka topic to consume Telegram updates from
    topic: easygram-updates

    # Auto-create the topic on startup if it does not exist (default: true)
    create-if-absent: true
    partitions: 1
    replication-factor: 1

spring:
  application:
    name: kafka-consumer-bot

  kafka:
    bootstrap-servers: 10.0.0.2:9092
    consumer:
      group-id: my-telegram-bot
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all

logging:
  level:
    uz.osoncode: DEBUG
    org.springframework.kafka: WARN
