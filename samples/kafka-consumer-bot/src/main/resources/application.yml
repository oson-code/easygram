easygram:
  # Required: your Telegram Bot API token from @BotFather.
  # Run with: BOT_TOKEN=<your-token> mvn spring-boot:run
  token: "${BOT_TOKEN}"

  messaging:
    # Declare this bot as a CONSUMER: it receives updates from Kafka, not from Telegram directly.
    type: CONSUMER
    consumer:
      # Broker type to consume from: KAFKA | RABBIT
      type: KAFKA
    kafka:
      # Kafka topic to consume Telegram updates from
      topic: easygram-updates
      # Kafka consumer group ID (default: easygram-bot)
      group-id: my-telegram-bot
      # Auto-create the topic on startup if it does not exist (default: true)
      create-if-absent: true
      partitions: 1
      replication-factor: 1

spring:
  application:
    name: kafka-consumer-bot

  kafka:
    # Run: docker compose up -d  (see docker-compose.yml)
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

