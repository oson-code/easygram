telegram:
  bot:
    # Required: paste your Telegram Bot API token from @BotFather here.
    token: "BOT_TOKEN"

    # Transport defaults to LONG_POLLING — no need to set it explicitly.
    # transport: LONG_POLLING

spring:
  application:
    name: i18n-registration-bot

  # Spring MessageSource configuration.
  # Files: src/main/resources/messages/bot.properties         (default / EN fallback)
  #        src/main/resources/messages/bot_en.properties      (English)
  #        src/main/resources/messages/bot_uz.properties      (Uzbek)
  #        src/main/resources/messages/bot_ru.properties      (Russian)
  messages:
    basename: messages/bot
    encoding: UTF-8
    # Use the message key itself as the default if a translation is missing.
    use-code-as-default-message: false

management:
  endpoints:
    web:
      exposure:
        # Expose health, info and prometheus endpoints.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # Show full health details (id, username, transport, …) from BotHealthIndicator.
      show-details: always
  metrics:
    distribution:
      # Enable full histogram buckets for telegram.bot.update so that Grafana can
      # compute accurate quantiles (e.g. P95 latency) with histogram_quantile().
      percentiles-histogram:
        telegram.bot.update: true

logging:
  level:
    uz.osoncode: DEBUG
