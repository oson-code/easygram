# --- Приветствие / start ---
welcome.title=\uD83D\uDC4B Добро пожаловать, {0}!
welcome.body=Я бот регистрации с полной поддержкой i18n.\n\nЯзык ответов определяется автоматически по настройкам вашего Telegram.
welcome.commands=Команды:\n  /register \u2014 начать регистрацию\n  /status   \u2014 статус анкеты\n  /cancel   \u2014 отменить

# --- Регистрация ---
register.start=\uD83D\uDCDD Начнём регистрацию!\n\nШаг 1/3 \u2014 Введите ваше полное имя:
register.name.saved=\u2705 Имя сохранено: {0}\n\nШаг 2/3 \u2014 Введите номер телефона.\nФормат: +XXXXXXXXXXXX (с кодом страны)
register.phone.invalid=\u26A0\uFE0F Неверный формат номера. Используйте международный формат, например: +79001234567
register.phone.saved=\u2705 Телефон сохранён: {0}\n\nШаг 3/3 \u2014 В каком городе вы живёте?
register.complete=\uD83C\uDF89 Регистрация завершена!\n\nВаши данные:\n\u2022 Имя:     {0}\n\u2022 Телефон: {1}\n\u2022 Город:   {2}\n\nДля обновления используйте /register.
register.cancelled=\u274C Регистрация отменена. Для начала используйте /register.

# --- Статус ---
status.none=\u2139\uFE0F Активной регистрации нет. Начните с /register.
status.awaiting_name=\uD83D\uDCDD Регистрация в процессе \u2014 ожидаю ваше имя (шаг 1/3).
status.awaiting_phone=\uD83D\uDCDD Регистрация в процессе \u2014 ожидаю номер телефона (шаг 2/3).
status.awaiting_city=\uD83D\uDCDD Регистрация в процессе \u2014 ожидаю название города (шаг 3/3).

# --- Отмена ---
cancel.none=\u2139\uFE0F Нет активной регистрации для отмены.
cancel.done=\u274C Регистрация отменена. Начните заново с /register.

# --- Стандартный ответ ---
error.unknown=Я не понял вашего сообщения.\n/register \u2014 начать, /status \u2014 статус, /cancel \u2014 отменить.
error.validation=\u26A0\uFE0F \u041D\u0435\u0432\u0435\u0440\u043D\u044B\u0435 \u0434\u0430\u043D\u043D\u044B\u0435:\n{0}

# --- Кнопки ---
btn.cancel=\u274C Отмена
btn.send.phone=\uD83D\uDCF1 Поделиться номером
btn.main_menu=\uD83C\uDFE0 Главное меню
