# ============================================================
# Default message bundle (English fallback)
# Used when no locale-specific bundle matches.
# ============================================================

# --- Welcome / start ---
welcome.title=\uD83D\uDC4B Welcome, #{0}!
welcome.body=I am a registration bot with full i18n support.\n\nI speak English, \u0423\u0437\u0431\u0435\u043A\u0447\u0430 and \u0420\u0443\u0441\u0441\u043A\u0438\u0439 \u2014 my reply language is detected from your Telegram profile.
welcome.commands=Commands:\n  /register \u2014 start the registration wizard\n  /status   \u2014 check wizard progress\n  /cancel   \u2014 cancel the wizard at any step

# --- Registration wizard ---
register.start=\uD83D\uDCDD Let\u2019s get you registered!\n\nStep 1/3 \u2014 What is your full name?
register.name.saved=\u2705 Name saved: #{0}\n\nStep 2/3 \u2014 Please enter your phone number.\nFormat: +XXXXXXXXXXXX (include country code)
register.phone.invalid=\u26A0\uFE0F Invalid phone number. Please use international format, e.g. +998901234567
register.phone.saved=\u2705 Phone saved: #{0}\n\nStep 3/3 \u2014 Which city do you live in?
register.complete=\uD83C\uDF89 Registration complete!\n\nYour details:\n\u2022 Name:  #{0}\n\u2022 Phone: #{1}\n\u2022 City:  #{2}\n\nUse /register to update your profile.
register.cancelled=\u274C Registration cancelled. Use /register to start again.

# --- Status messages ---
status.none=\u2139\uFE0F No active registration wizard. Use /register to start one.
status.awaiting_name=\uD83D\uDCDD Wizard in progress \u2014 waiting for your name (step 1/3).
status.awaiting_phone=\uD83D\uDCDD Wizard in progress \u2014 waiting for your phone number (step 2/3).
status.awaiting_city=\uD83D\uDCDD Wizard in progress \u2014 waiting for your city (step 3/3).

# --- Cancel ---
cancel.none=\u2139\uFE0F There is no active wizard to cancel.
cancel.done=\u274C Registration wizard cancelled. Use /register to start again.

# --- Default / fallback ---
error.unknown=I didn\u2019t understand that.\nUse /register to start, /status to check progress, or /cancel to abort.
error.validation=\u26A0\uFE0F Invalid input:\n#{0}

# --- Keyboard buttons ---
btn.cancel=\u274C Cancel
btn.send.phone=\u274C Send phone
btn.main_menu=\uD83C\uDFE0 Main menu

name.limit=Length of name must be between 2 and 50