# ============================================================
# Uzbek message bundle (uz)
# ============================================================

# --- Xush kelibsiz / start ---
welcome.title=\uD83D\uDC4B Xush kelibsiz, #{0}!
welcome.body=Men ro\u2019yxatdan o\u2019tkazish boti bo\u2019lib, to\u2019liq i18n qo\u2019llab-quvvatlashga egaman.\n\nTil Telegram profilingizdagi til sozlamalaridan avtomatik aniqlanadi.
welcome.commands=Buyruqlar:\n  /register \u2014 ro\u2019yxatdan o\u2019tish\n  /status   \u2014 jarayon holati\n  /cancel   \u2014 bekor qilish

# --- Ro'yxatdan o'tish ---
register.start=\uD83D\uDCDD Ro\u2019yxatdan o\u2019tamiz!\n\n1/3-qadam \u2014 To\u2019liq ismingizni kiriting:
register.name.saved=\u2705 Ism saqlandi: #{0}\n\n2/3-qadam \u2014 Telefon raqamingizni kiriting.\nFormat: +XXXXXXXXXXXX (mamlakat kodi bilan)
register.phone.invalid=\u26A0\uFE0F Noto\u2019g\u2019ri telefon raqami. Xalqaro formatdan foydalaning, masalan: +998901234567
register.phone.saved=\u2705 Telefon saqlandi: #{0}\n\n3/3-qadam \u2014 Qaysi shaharda yashaysiz?
register.complete=\uD83C\uDF89 Ro\u2019yxatdan o\u2019tish yakunlandi!\n\nMa\u2019lumotlaringiz:\n\u2022 Ism:     #{0}\n\u2022 Telefon: #{1}\n\u2022 Shahar:  #{2}\n\nMa\u2019lumotlarni yangilash uchun /register buyrug\u2019ini ishlating.
register.cancelled=\u274C Ro\u2019yxatdan o\u2019tish bekor qilindi. Qayta boshlash uchun /register.

# --- Holat xabarlari ---
status.none=\u2139\uFE0F Faol jarayon yo\u2019q. Boshlash uchun /register.
status.awaiting_name=\uD83D\uDCDD Jarayon davom etmoqda \u2014 ismingiz kutilmoqda (1/3-qadam).
status.awaiting_phone=\uD83D\uDCDD Jarayon davom etmoqda \u2014 telefon raqamingiz kutilmoqda (2/3-qadam).
status.awaiting_city=\uD83D\uDCDD Jarayon davom etmoqda \u2014 shahringiz kutilmoqda (3/3-qadam).

# --- Bekor qilish ---
cancel.none=\u2139\uFE0F Bekor qilish uchun faol jarayon yo\u2019q.
cancel.done=\u274C Ro\u2019yxatdan o\u2019tish bekor qilindi. Qayta boshlash uchun /register.

# --- Standart javob ---
error.unknown=Tushunmadim.\n/register \u2014 boshlash, /status \u2014 holat, /cancel \u2014 bekor qilish.
error.validation=\u26A0\uFE0F Noto\u2019g\u2019ri ma\u2019lumot:\n#{0}

# --- Tugmalar ---
btn.cancel=\u274C Bekor qilish
btn.send.phone=\uD83D\uDCF1 Telefon raqamni ulashing
btn.main_menu=\uD83C\uDFE0 Bosh menyu
