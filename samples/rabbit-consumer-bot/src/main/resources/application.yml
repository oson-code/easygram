easygram:
  # Required: your Telegram Bot API token from @BotFather.
  # Run with: BOT_TOKEN=<your-token> mvn spring-boot:run
  token: "${BOT_TOKEN}"

  update:
    # Consume updates from RabbitMQ (produced by a separate bot instance).
    transport: RABBIT_CONSUMER

  messaging:
    rabbit:
      # RabbitMQ queue to consume Telegram updates from
      queue: easygram-updates
      # Exchange and routing key used when auto-creating the binding
      exchange: easygram-exchange
      routing-key: easygram.updates
      # Auto-create the exchange, queue and binding on startup (default: true)
      create-if-absent: true

spring:
  application:
    name: rabbit-consumer-bot

  rabbitmq:
    # Run: docker compose up -d  (see docker-compose.yml)
    host: localhost
    port: 5672
    username: rabbit
    password: rabbit

