easygram:
  # Required: your Telegram Bot API token from @BotFather.
  # Run with: BOT_TOKEN=<your-token> mvn spring-boot:run
  token: "${BOT_TOKEN}"

  # update.transport defaults to LONG_POLLING — no need to set it explicitly.

spring:
  application:
    name: longpolling-bot

logging:
  level:
    uz.osoncode: DEBUG
