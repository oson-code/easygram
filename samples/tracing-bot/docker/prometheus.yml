# Prometheus configuration for the tracing-bot sample.
# Mounted at /etc/prometheus/prometheus.yml inside the container.
#
# The bot runs on the Docker host (not inside the compose network), so we use
# host.docker.internal to reach it.  On Linux, docker-compose.yml adds
# extra_hosts: ["host.docker.internal:host-gateway"] to the prometheus service
# so this hostname resolves correctly.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: tracing-bot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8086
        labels:
          application: tracing-bot
