# Grafana Tempo configuration for the tracing-bot sample.
# Mounted at /etc/tempo.yml inside the container.
# Reference: https://grafana.com/docs/tempo/latest/configuration/
#
# NOTE: top-level `ingester` and `compactor` keys are NOT valid in the latest
# Grafana Tempo — they were removed from app.Config. Configuration for storage
# retention lives under storage.trace.block.retention instead.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    # No block: section needed — default retention is 336 h (14 days), fine for a demo.
