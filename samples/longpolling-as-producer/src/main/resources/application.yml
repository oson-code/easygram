telegram:
  bot:
    # Required: your Telegram Bot API token from @BotFather
    token: "BOT_TOKEN"

    # Transport is LONG_POLLING by default
    # transport: LONG_POLLING

    messaging:
      # true  → forward ONLY to broker; local @BotController handlers are skipped
      # false → forward to broker AND run local handlers
      forward-only: true

      producer:
        # consumer-type: rabbit
        producer-type: kafka

      # ── Kafka settings (active when consumer-type=kafka) ───────────────────
      kafka:
        topic: telegram-updates
        create-if-absent: true   # auto-create topic on startup
        partitions: 1
        replication-factor: 1

      # ── RabbitMQ settings (active when consumer-type=rabbit) ───────────────
      rabbit:
        exchange: telegram-exchange
        routing-key: telegram.updates
        queue: telegram-updates
        create-if-absent: true   # auto-create exchange, queue and binding on startup

# ── Spring Kafka (required when consumer-type=kafka) ─────────────────────────
spring:
  application:
    name: longpolling-as-producer

  kafka:
    bootstrap-servers: 10.0.0.2:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

  # ── Spring RabbitMQ (required when consumer-type=rabbit) ─────────────────
  rabbitmq:
    host: 10.0.0.2
    port: 5675
    username: rabbit
    password: rabbit

logging:
  level:
    uz.osoncode: DEBUG
    org.springframework.kafka: WARN
    org.springframework.amqp: WARN
