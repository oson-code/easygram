# =============================================================================
# REQUIRED — minimum configuration to run this sample
# =============================================================================
easygram:
  # Required: your Telegram Bot API token from @BotFather.
  # Run with: BOT_TOKEN=<your-token> mvn spring-boot:run
  token: "${BOT_TOKEN}"

  update:
    transport: WEBHOOK
    webhook:
      # Required: the public HTTPS URL Telegram will POST updates to
      url: "https://example.com${easygram.update.webhook.path}"

  messaging:
    # true  → forward ONLY to broker; local @BotController handlers are skipped
    # false → forward to broker AND run local handlers (default)
    forward-only: true

    producer:
      # Choose which broker to publish to: KAFKA | RABBIT
      type: KAFKA

# ── Spring Kafka (required when producer.type=KAFKA) ─────────────────────────
spring:
  application:
    name: webhook-as-producer

  kafka:
    # Run: docker compose up -d  (see docker-compose.yml)
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # ── Spring RabbitMQ (required when producer.type=RABBIT) ─────────────────
  rabbitmq:
    # Run: docker compose up -d  (see docker-compose.yml)
    host: localhost
    port: 5672
    username: rabbit
    password: rabbit

